name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dte_21_screener
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dte_21_screener
          persist-credentials: false
      - name: Checkout pinned public provider source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: victor000000/data_providers
          ref: c32b218385d999fbeb4052c1d70bdb7ebae3b21f
          path: data_providers
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.14'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check maintained documentation
        run: uv run --locked python scripts/check_docs.py
      - name: JavaScript syntax and refresh behavior
        run: |
          for script in apps/trading_web/static/*.js tests/browser/*.cjs tests/apps/trading_web/*.test.cjs; do
            node --check "$script"
          done
          node tests/browser/risk_refresh.cjs
          for suite in tests/apps/trading_web/*.test.cjs; do
            node "$suite"
          done
      - name: Offline code and full Python unit suite
        env:
          CHECK_NATIVE_REQUIRED: '0'
        run: make check
# No deployment job: no public deployment target or deployment credentials configured.
# Runtime data audits, broker connections and native solver checks require local evidence.
